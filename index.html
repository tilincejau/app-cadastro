<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#154027">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cadastro Lince</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --verde:#154027; --verde2:#1f5a37; --verde-claro:#e7efe9;
  --dourado:#C49F46; --dourado-claro:#f6efdd;
  --fundo:#f4f6f3; --texto:#1d2b22; --mut:#6b7a70; --borda:#dde3de;
  --vermelho:#a52a2a; --verm-claro:#fbeaea; --amarelo:#9a6b00; --amar-claro:#fdf3d9;
  --azul:#2b5d8a; --azul-claro:#e6eef6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--texto);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}
button{cursor:pointer}
.hide{display:none!important}

/* topo */
.topo{position:sticky;top:0;z-index:10;background:var(--verde);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 0;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topo .l1{display:flex;align-items:center;gap:10px;min-height:44px}
.topo img{height:34px}
.topo .quem{margin-left:auto;text-align:right;font-size:12px;line-height:1.3}
.topo .quem b{font-size:14px;color:var(--dourado)}
.btn-ico{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;width:38px;height:38px;font-size:18px}
.barra-sync{display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 0 8px;color:#d9e6dc}
.barra-sync .dot{width:9px;height:9px;border-radius:50%;background:#7bd389;flex:none}
.barra-sync .dot.off{background:#e57373}.barra-sync .dot.sync{background:var(--dourado);animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.3}}
.barra-sync .fila{margin-left:auto;background:var(--dourado);color:var(--verde);font-weight:700;border-radius:20px;padding:2px 9px}
.abas{display:flex;gap:4px}
.abas button{flex:1;background:transparent;border:0;color:#cfe0d4;padding:10px 4px;border-bottom:3px solid transparent;font-weight:600}
.abas button.on{color:#fff;border-bottom-color:var(--dourado)}

main{padding:12px;max-width:820px;margin:0 auto;padding-bottom:90px}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#fff 0%,var(--fundo) 60%,var(--verde-claro) 100%)}
.login .card{width:100%;max-width:380px;background:#fff;border-radius:18px;padding:28px 22px;box-shadow:0 8px 30px rgba(21,64,39,.12);border-top:6px solid var(--verde)}
.login img{display:block;width:78%;margin:0 auto 6px}
.login h1{font-size:16px;text-align:center;color:var(--mut);font-weight:500;margin:4px 0 20px}
.login .linha-d{height:3px;width:60px;background:var(--dourado);margin:10px auto 18px;border-radius:3px}

label.lb{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
input.in,select.in{width:100%;padding:12px;border:1.5px solid var(--borda);border-radius:10px;background:#fff;color:var(--texto)}
input.in:focus,select.in:focus{outline:none;border-color:var(--verde)}
.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:700;background:var(--verde);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.full{width:100%;margin-top:18px;padding:14px}
.btn.ouro{background:var(--dourado);color:var(--verde)}
.btn.zap{background:#1f9d55}
.btn.sec{background:#fff;color:var(--verde);border:1.5px solid var(--verde)}
.btn.perigo{background:#fff;color:var(--vermelho);border:1.5px solid #e6c3c3}
.btn.peq{padding:9px 11px;font-size:13px}
.btn:disabled{opacity:.5}
.erro{background:var(--verm-claro);color:var(--vermelho);border-radius:10px;padding:10px;margin-top:12px;font-size:14px}
.aviso{background:var(--dourado-claro);color:#6a5212;border-radius:10px;padding:10px;margin:10px 0;font-size:13px}

/* filtros */
.filtros{background:#fff;border-radius:14px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid var(--borda)}
.filtros .busca{grid-column:1/-1}
.filtros select,.filtros input{padding:10px}
.dias{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto}
.dias button{flex:1;min-width:52px;border:1.5px solid var(--borda);background:#fff;border-radius:20px;padding:7px 6px;font-weight:600;color:var(--mut);font-size:13px}
.dias button.on{background:var(--verde);border-color:var(--verde);color:#fff}
.resumo{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.resumo .chip{cursor:pointer}

/* lista */
.cli{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid var(--borda);border-left:5px solid var(--borda);display:flex;gap:10px;align-items:center;cursor:pointer}
.cli.NI{border-left-color:#c9cfca}.cli.AG{border-left-color:var(--dourado)}.cli.OK{border-left-color:var(--verde)}.cli.EA{border-left-color:var(--azul)}
.cli .nm{font-weight:700;font-size:15px}
.cli .sub{font-size:12px;color:var(--mut);margin-top:2px}
.cli .dir{margin-left:auto;text-align:right;flex:none}
.cli .ic{font-size:12px;color:var(--mut);margin-top:4px}
.mais{width:100%;margin-top:6px}

.chip{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap;background:#eef0ee;color:var(--mut)}
.chip.verde{background:var(--verde-claro);color:var(--verde)}
.chip.ouro{background:var(--amar-claro);color:var(--amarelo)}
.chip.verm{background:var(--verm-claro);color:var(--vermelho)}
.chip.azul{background:var(--azul-claro);color:var(--azul)}
.chip.cinza{background:#eef0ee;color:var(--mut)}

/* detalhe */
.det-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.det-top h2{margin:0;font-size:18px;color:var(--verde)}
.box{background:#fff;border-radius:14px;padding:14px;border:1px solid var(--borda);margin-bottom:12px}
.box h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--verde);display:flex;align-items:center;gap:6px}
.box h3::before{content:"";width:4px;height:14px;background:var(--dourado);border-radius:2px}
.info{font-size:13px;color:var(--mut);line-height:1.6}
.info b{color:var(--texto)}
.item{border:1px solid var(--borda);border-radius:12px;padding:12px;margin-bottom:10px}
.item .val{font-size:17px;font-weight:700;word-break:break-all}
.item .meta{font-size:12px;color:var(--mut);margin:4px 0 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.item .acoes{display:flex;gap:6px;flex-wrap:wrap}
.add{display:flex;gap:6px;margin-top:6px}
.add input{flex:1}
.hist{font-size:12px;color:var(--mut);border-top:1px dashed var(--borda);margin-top:8px;padding-top:6px}
.hist div{margin:2px 0}
.nsinc{color:var(--amarelo);font-weight:700}

/* painel */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media(min-width:600px){.cards{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border-radius:12px;padding:12px;border:1px solid var(--borda);border-top:4px solid var(--verde)}
.kpi.o{border-top-color:var(--dourado)}
.kpi .n{font-size:24px;font-weight:800;color:var(--verde)}
.kpi .t{font-size:12px;color:var(--mut)}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;background:var(--verde);color:#fff;padding:8px 6px;font-weight:600;font-size:12px}
.tb td{padding:8px 6px;border-bottom:1px solid var(--borda)}
.tb tr:nth-child(even) td{background:#fafbfa}
.scroll{overflow-x:auto}
.barra{height:6px;background:#e6ebe7;border-radius:4px;overflow:hidden;min-width:60px}
.barra i{display:block;height:100%;background:var(--verde)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--verde);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:99;font-size:14px;max-width:90%;border-left:5px solid var(--dourado)}
.vazio{text-align:center;color:var(--mut);padding:30px 10px}
.menu{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 52px);background:#fff;color:var(--texto);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);overflow:hidden;z-index:20;min-width:220px}
.menu button{display:block;width:100%;text-align:left;background:#fff;border:0;padding:13px 16px;border-bottom:1px solid var(--borda)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hide"></div>
<script src="config.js"></script>
<script src="fone.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>

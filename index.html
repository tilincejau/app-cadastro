<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#154027">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cadastro Lince</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --verde:#154027; --verde2:#1f5a37; --verde-claro:#e7efe9;
  --dourado:#C49F46; --dourado-claro:#f6efdd;
  --fundo:#f4f6f3; --texto:#1d2b22; --mut:#6b7a70; --borda:#dde3de;
  --vermelho:#a52a2a; --verm-claro:#fbeaea; --amarelo:#9a6b00; --amar-claro:#fdf3d9;
  --azul:#2b5d8a; --azul-claro:#e6eef6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--texto);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}
button{cursor:pointer}
.hide{display:none!important}

/* topo */
.topo{position:sticky;top:0;z-index:10;background:var(--verde);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 0;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topo .l1{display:flex;align-items:center;gap:10px;min-height:44px}
.topo img{height:34px}
.topo .quem{margin-left:auto;text-align:right;font-size:12px;line-height:1.3}
.topo .quem b{font-size:14px;color:var(--dourado)}
.btn-ico{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;width:38px;height:38px;font-size:18px}
.barra-sync{display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 0 8px;color:#d9e6dc}
.barra-sync .dot{width:9px;height:9px;border-radius:50%;background:#7bd389;flex:none}
.barra-sync .dot.off{background:#e57373}.barra-sync .dot.sync{background:var(--dourado);animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.3}}
.barra-sync .fila{margin-left:auto;background:var(--dourado);color:var(--verde);font-weight:700;border-radius:20px;padding:2px 9px}
.abas{display:flex;gap:4px}
.abas button{flex:1;background:transparent;border:0;color:#cfe0d4;padding:10px 4px;border-bottom:3px solid transparent;font-weight:600}
.abas button.on{color:#fff;border-bottom-color:var(--dourado)}

main{padding:12px;max-width:820px;margin:0 auto;padding-bottom:90px}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#fff 0%,var(--fundo) 60%,var(--verde-claro) 100%)}
.login .card{width:100%;max-width:380px;background:#fff;border-radius:18px;padding:28px 22px;box-shadow:0 8px 30px rgba(21,64,39,.12);border-top:6px solid var(--verde)}
.login img{display:block;width:78%;margin:0 auto 6px}
.login h1{font-size:16px;text-align:center;color:var(--mut);font-weight:500;margin:4px 0 20px}
.login .linha-d{height:3px;width:60px;background:var(--dourado);margin:10px auto 18px;border-radius:3px}

label.lb{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
input.in,select.in{width:100%;padding:12px;border:1.5px solid var(--borda);border-radius:10px;background:#fff;color:var(--texto)}
input.in:focus,select.in:focus{outline:none;border-color:var(--verde)}
.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:700;background:var(--verde);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.full{width:100%;margin-top:18px;padding:14px}
.btn.ouro{background:var(--dourado);color:var(--verde)}
.btn.zap{background:#1f9d55}
.btn.sec{background:#fff;color:var(--verde);border:1.5px solid var(--verde)}
.btn.perigo{background:#fff;color:var(--vermelho);border:1.5px solid #e6c3c3}
.btn.peq{padding:9px 11px;font-size:13px}
.btn:disabled{opacity:.5}
.erro{background:var(--verm-claro);color:var(--vermelho);border-radius:10px;padding:10px;margin-top:12px;font-size:14px}
.aviso{background:var(--dourado-claro);color:#6a5212;border-radius:10px;padding:10px;margin:10px 0;font-size:13px}

/* filtros */
.filtros{background:#fff;border-radius:14px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid var(--borda)}
.filtros .busca{grid-column:1/-1}
.filtros select,.filtros input{padding:10px}
.dias{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto}
.dias button{flex:1;min-width:52px;border:1.5px solid var(--borda);background:#fff;border-radius:20px;padding:7px 6px;font-weight:600;color:var(--mut);font-size:13px}
.dias button.on{background:var(--verde);border-color:var(--verde);color:#fff}
.resumo{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.resumo .chip{cursor:pointer}

/* lista */
.cli{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid var(--borda);border-left:5px solid var(--borda);display:flex;gap:10px;align-items:center;cursor:pointer}
.cli.NI{border-left-color:#c9cfca}.cli.AG{border-left-color:var(--dourado)}.cli.OK{border-left-color:var(--verde)}.cli.EA{border-left-color:var(--azul)}
.cli .nm{font-weight:700;font-size:15px}
.cli .sub{font-size:12px;color:var(--mut);margin-top:2px}
.cli .dir{margin-left:auto;text-align:right;flex:none}
.cli .ic{font-size:12px;color:var(--mut);margin-top:4px}
.mais{width:100%;margin-top:6px}

.chip{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap;background:#eef0ee;color:var(--mut)}
.chip.verde{background:var(--verde-claro);color:var(--verde)}
.chip.ouro{background:var(--amar-claro);color:var(--amarelo)}
.chip.verm{background:var(--verm-claro);color:var(--vermelho)}
.chip.azul{background:var(--azul-claro);color:var(--azul)}
.chip.cinza{background:#eef0ee;color:var(--mut)}

/* detalhe */
.det-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.det-top h2{margin:0;font-size:18px;color:var(--verde)}
.box{background:#fff;border-radius:14px;padding:14px;border:1px solid var(--borda);margin-bottom:12px}
.box h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--verde);display:flex;align-items:center;gap:6px}
.box h3::before{content:"";width:4px;height:14px;background:var(--dourado);border-radius:2px}
.info{font-size:13px;color:var(--mut);line-height:1.6}
.info b{color:var(--texto)}
.item{border:1px solid var(--borda);border-radius:12px;padding:12px;margin-bottom:10px}
.item .val{font-size:17px;font-weight:700;word-break:break-all}
.item .meta{font-size:12px;color:var(--mut);margin:4px 0 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.item .acoes{display:flex;gap:6px;flex-wrap:wrap}
.inc{display:flex;gap:8px;align-items:flex-start;font-size:13px;background:var(--dourado-claro);border-radius:10px;padding:8px 10px;margin-bottom:8px;width:100%}
.inc input{margin-top:2px;width:18px;height:18px;accent-color:var(--verde)}
.add{display:flex;gap:6px;margin-top:6px}
.add input{flex:1}
.hist{font-size:12px;color:var(--mut);border-top:1px dashed var(--borda);margin-top:8px;padding-top:6px}
.hist div{margin:2px 0}
.nsinc{color:var(--amarelo);font-weight:700}

/* painel */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media(min-width:600px){.cards{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border-radius:12px;padding:12px;border:1px solid var(--borda);border-top:4px solid var(--verde)}
.kpi.o{border-top-color:var(--dourado)}
.kpi .n{font-size:24px;font-weight:800;color:var(--verde)}
.kpi .t{font-size:12px;color:var(--mut)}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;background:var(--verde);color:#fff;padding:8px 6px;font-weight:600;font-size:12px}
.tb td{padding:8px 6px;border-bottom:1px solid var(--borda)}
.tb tr:nth-child(even) td{background:#fafbfa}
.scroll{overflow-x:auto}
.barra{height:6px;background:#e6ebe7;border-radius:4px;overflow:hidden;min-width:60px}
.barra i{display:block;height:100%;background:var(--verde)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--verde);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:99;font-size:14px;max-width:90%;border-left:5px solid var(--dourado)}
.vazio{text-align:center;color:var(--mut);padding:30px 10px}
.menu{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 52px);background:#fff;color:var(--texto);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);overflow:hidden;z-index:20;min-width:220px}
.menu button{display:block;width:100%;text-align:left;background:#fff;border:0;padding:13px 16px;border-bottom:1px solid var(--borda)}

/* ===== Ajuste compacto para celular ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (max-width:600px){
  html,body{font-size:13px}
  .topo{padding:calc(env(safe-area-inset-top) + 4px) 10px 0}
  .topo .l1{min-height:38px;gap:8px}
  .topo img{height:26px}
  .topo .quem{font-size:10.5px}.topo .quem b{font-size:12px}
  .btn-ico{width:32px;height:32px;font-size:15px;border-radius:8px}
  .barra-sync{font-size:10.5px;padding:3px 0 5px}
  .barra-sync .fila{padding:1px 7px}
  .abas button{padding:7px 4px;font-size:12.5px}
  main{padding:8px 8px 70px}
  .login .card{padding:20px 16px}
  .login h1{font-size:13px;margin:2px 0 12px}
  label.lb{font-size:10.5px;margin:8px 0 3px}
  input.in,select.in{padding:8px 10px;font-size:14px;border-radius:8px}
  .filtros{padding:8px;gap:6px;border-radius:10px}
  .filtros select,.filtros input{padding:7px 8px}
  .dias{gap:4px}
  .dias button{padding:5px 4px;font-size:11.5px;min-width:40px}
  .resumo{gap:4px;margin:7px 0}
  .chip{font-size:10.5px;padding:2px 7px}
  .cli{padding:8px 10px;margin-bottom:6px;gap:8px;border-left-width:4px;border-radius:10px}
  .cli .nm{font-size:13px}
  .cli .sub{font-size:11px;margin-top:1px}
  .cli .ic{font-size:10.5px;margin-top:3px}
  .det-top h2{font-size:15px}
  .det-top{margin-bottom:6px}
  .box{padding:10px;margin-bottom:8px;border-radius:10px}
  .box h3{font-size:11px;margin-bottom:7px}
  .info{font-size:11.5px;line-height:1.5}
  .item{padding:8px 10px;margin-bottom:7px;border-radius:10px}
  .item .val{font-size:14.5px}
  .item .meta{font-size:10.5px;margin:3px 0 6px;gap:4px}
  .item .acoes{gap:5px}
  .btn{padding:8px 10px;border-radius:8px}
  .btn.peq{padding:6px 9px;font-size:12px}
  .btn.full{padding:11px;margin-top:14px}
  .inc{font-size:11.5px;padding:6px 8px;gap:6px;margin-bottom:6px}
  .inc input{width:15px;height:15px}
  .hist{font-size:10.5px}
  .add{gap:5px}
  .aviso,.erro{font-size:12px;padding:8px}
  .kpi{padding:8px 10px}.kpi .n{font-size:19px}.kpi .t{font-size:10.5px}
  .cards{gap:6px;margin-bottom:8px}
  table.tb{font-size:11.5px}.tb th{font-size:10.5px;padding:6px 5px}.tb td{padding:6px 5px}
  .toast{font-size:12.5px;padding:9px 14px}
  .menu button{padding:10px 14px;font-size:13px}
  .vazio{padding:18px 8px}
}

/* ===== modal / sem rolagem lateral ===== */
html,body{overflow-x:hidden;max-width:100%}
.modal-fundo{position:fixed;inset:0;background:rgba(10,30,18,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.2);border-top:5px solid var(--dourado)}
@media(min-width:600px){.modal-fundo{align-items:center}.modal{border-radius:16px}}
.modal-t{font-weight:800;color:var(--verde);font-size:16px}
.modal-old{text-decoration:line-through;color:var(--vermelho);font-weight:700;margin:4px 0 6px;word-break:break-all}
.modal p{margin:8px 0;font-size:13.5px;color:var(--texto)}
.modal-rest{background:var(--verde-claro);border-radius:10px;padding:8px 10px;font-size:13.5px;line-height:1.7}
.modal-b{display:flex;gap:8px;margin-top:12px}.modal-b .btn{flex:1}
.modal-b.col{flex-direction:column}
.modal-erro{color:var(--vermelho);font-size:12.5px;margin-top:6px;min-height:1em}
.dica{font-size:11.5px;color:var(--mut);margin-top:4px}
/* painel compacto */
table.tb.fix{table-layout:fixed;width:100%}
.tb.fix th,.tb.fix td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra{min-width:0}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.mini div{background:#f4f6f3;border-radius:8px;padding:6px 4px;text-align:center}
.mini b{display:block;font-size:16px;color:var(--verde)}
.mini span{font-size:10.5px;color:var(--mut)}
.mini .v{background:var(--verde-claro)}.mini .o{background:var(--amar-claro)}.mini .o b{color:var(--amarelo)}.mini .r{background:var(--verm-claro)}.mini .r b{color:var(--vermelho)}
.mini-u{font-size:12px;color:var(--mut);margin:6px 0 4px}
.hl .hr{border-bottom:1px solid var(--borda);padding:8px 2px;cursor:pointer}
.hl .hr:last-child{border-bottom:0}
.hr1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.hr1 b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hr2{font-size:13px;margin-top:2px;word-break:break-all}
.hr3{font-size:11px;color:var(--mut);margin-top:2px}
@media (max-width:600px){
  .dias button{min-width:0;flex:1 1 0;padding:5px 0;font-size:11px}
  .filtros{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .filtros select{min-width:0}
  .cli .dir{max-width:42%}
  .cli>div:first-child{flex:1;min-width:0}
}

.envio{border:2px solid #1f9d55;background:#f5fbf7}
.envio h3{color:#1f7a45}
.env-st{margin:4px 0 2px;font-size:11.5px;min-height:18px}
.env-opts{font-size:11.5px;color:var(--mut);margin:2px 0}
.env-opts .chip{border:0;cursor:pointer;margin:2px 2px 0 0}
.it-l{display:flex;align-items:center;gap:6px 8px;justify-content:space-between;flex-wrap:wrap}
.val.tel{white-space:nowrap}
.it-l .acoes{flex:none}
.it-l .val{min-width:0}
.menu .ver{font-size:11px;color:var(--mut);padding:8px 16px;text-align:center}

.cr{display:flex;gap:6px;align-items:stretch}
.cr .in{flex:1;min-width:0}
.btn.xq{padding:0;width:40px;flex:none;font-size:15px}
.btn.peq.xq{width:34px;height:32px}
.org{color:var(--mut);margin-left:4px}
.outro{border:1px solid var(--borda);background:#fff;border-radius:10px;padding:7px 9px;margin-top:6px}
.outro .o1{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.outro .val{font-size:14px;font-weight:700;min-width:0;word-break:break-all}
.outro .ob{display:flex;gap:5px;flex:none}
.outro .o2{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:10.5px}
details.addt{margin:10px 0 0}
details.addt summary{cursor:pointer;color:var(--verde);font-weight:700;font-size:12.5px;list-style:none}
details.addt summary::-webkit-details-marker{display:none}

.outro.ok{border-color:#bcd9c5;background:#f3faf5}
.btn.bok{background:var(--verde);color:#fff}
.btn.feito{background:#e7efe9;color:var(--verde);border:1.5px solid #bcd9c5}
.vazio-p{font-size:12px;color:var(--mut);padding:6px 2px}
.modal-old2{font-size:13px;color:var(--mut);margin:4px 0}
.envio{border-color:var(--verde);background:#f7faf8}.envio h3{color:var(--verde)}

.exc{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--vermelho);color:#fff;font-weight:900;font-size:12px;margin-right:6px;vertical-align:1px;flex:none}
.pbs{display:flex;flex-wrap:wrap;gap:3px;margin:3px 0 1px}
.pbs span{background:var(--verm-claro);color:var(--vermelho);font-size:10px;font-weight:700;border-radius:10px;padding:1px 7px}
.cli.temPb{border-left-color:var(--vermelho)}
select.pbon{border-color:var(--vermelho);color:var(--vermelho);font-weight:700}
.outro.pb{border-color:#e9b9b9;background:#fff8f8}
.warn{font-size:11.5px;color:var(--vermelho);font-weight:600;margin-bottom:4px;line-height:1.35}
.pbtopo{background:var(--verm-claro);color:var(--vermelho);border-radius:10px;padding:8px 10px;font-size:12px;margin-bottom:8px;line-height:1.4}
.pbtopo small{color:#7a3a3a}
.kpi.pbk{border-top-color:var(--vermelho);cursor:pointer}.kpi.pbk .n{color:var(--vermelho)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hide"></div>
<script src="config.js"></script>
<script src="fone.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (r) { r.update(); }).catch(function () {});
  });
  // quando uma versão nova é instalada, recarrega uma vez (sem perder nada: a fila fica no aparelho)
  var recarregou = false, tinhaVersao = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (recarregou || !tinhaVersao) return;          // primeira instalação: não recarrega
    var digitando = document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
    if (digitando || document.querySelector('.modal-fundo')) return; // não atrapalha quem está digitando
    recarregou = true; location.reload();
  });
}
</script>
</body>
</html>
